# Публикация статического сайта Kevloro на GitHub Pages.
# Перед выкладкой прогоняются автотесты расчётов и проверка разметки:
# если что-то сломано, деплой не происходит и сайт остаётся рабочим.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой одновременно; начатые выкладки не отменяем.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Проверка расчётов и разметки
        run: |
          node tools/test-core.mjs
          node tools/test-calculators.mjs
          node tools/check.mjs

      - name: Prepare site directory
        run: |
          mkdir -p /tmp/site
          cp -r . /tmp/site/
          rm -rf /tmp/site/.git /tmp/site/.github /tmp/site/tools
          touch /tmp/site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
